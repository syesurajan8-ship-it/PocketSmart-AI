<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}PocketSmart{% endblock %}</title>
  <meta name="description" content="PocketSmart AI budget planning assistant">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  {% block head %}{% endblock %}
</head>
<body>
<header class="site-header">
  <a class="brand" href="{{ url_for('home') }}">PocketSmart</a>
  <nav class="nav-links">
    <a href="{{ url_for('home') }}#features">Features</a>
    <a href="{{ url_for('home') }}#testimonials">Testimonials</a>
    {% if user %}
      <a href="{{ url_for('dashboard') }}">Dashboard</a>
      <button class="nav-button" onclick="logout()">Sign out</button>
    {% else %}
      <a href="{{ url_for('login') }}">Sign in</a>
      <a class="nav-cta" href="{{ url_for('signup') }}">Get Started</a>
    {% endif %}
  </nav>
  <button class="mobile-menu" aria-label="Open menu" onclick="document.body.classList.toggle('menu-open')">☰</button>
</header>

<main>{% block content %}{% endblock %}</main>

<footer class="footer">
  <div>
    <strong>PocketSmart</strong>
    <span>AI-powered budget planning for everyday needs.</span>
  </div>
  <div class="footer-links">
    <a href="{{ url_for('home') }}">Home</a>
    <a href="{{ url_for('home') }}#features">Features</a>
    <a href="{{ url_for('home') }}#testimonials">Testimonials</a>
  </div>
</footer>

<div id="toast" class="toast" role="status"></div>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
